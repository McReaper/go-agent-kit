name: kit-approval

# Re-runs the review sheet's job when the owner approves a pull request,
# through the caller kit init writes, kit-approval.yml in the app. That job
# posts the owner's approval status the ruleset requires; re-running it, in
# the pull request's own run, re-runs the jobs after it too: Check, then
# Merge, which merges once the status says approved.

on:
  workflow_call:
    inputs:
      workflow:
        description: The app's workflow that calls kit-check.yml, whose run the approval re-runs.
        required: false
        type: string
        default: .github/workflows/kit.yml

permissions: {}

jobs:
  recheck:
    name: Check again
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write # re-run the review sheet's job
      statuses: read # the owner's approval status
    steps:
      - name: Re-run the review sheet of the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -eu
          if [ "$(gh api "repos/$REPO/commits/$HEAD/status" --jq '.statuses[] | select(.context == "Kit / Owner approval") | .state')" = success ]; then
            echo "the owner's approval status is already success: nothing to re-run"
            exit 0
          fi
          run=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD&event=pull_request" \
            --jq "[.workflow_runs[] | select(.path == \"$WORKFLOW\")] | first | .id // empty")
          if [ -z "$run" ]; then
            echo "::error::no run of $WORKFLOW for $HEAD"
            exit 1
          fi
          gh run watch "$run" --repo "$REPO" > /dev/null || true
          job=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest" \
            --jq '.jobs[] | select(.name | endswith("/ Review sheet")) | .id' | head -n 1)
          if [ -z "$job" ]; then
            echo "::error::run $run has no review sheet job"
            exit 1
          fi
          echo "re-running job $job of run $run"
          gh run rerun --job "$job" --repo "$REPO"
