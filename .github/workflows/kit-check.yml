name: kit-check

# The merge check apps run, through the caller kit init writes, pinned once
# by SHA:
#
#   jobs:
#     kit:
#       uses: McReaper/go-agent-kit/.github/workflows/kit-check.yml@<sha> # <tag>
#
# The kit it installs is the commit this workflow runs at, read from the
# job's OIDC token, so the pin Dependabot moves is the only one.
#
# The caller runs it on pull_request (opened, synchronize, reopened, edited)
# and pull_request_review (submitted), so a review re-runs the check; it
# grants contents and pull-requests write for the auto-merge, issues write
# for the label, id-token write for the version. An edit runs the jobs only
# when it moved the pull request's base.

on:
  workflow_call:
    inputs:
      kit-version:
        description: The kit's commit, to run another than the one this workflow runs at; by default that one.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  version:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      kit: ${{ steps.kit.outputs.version }}
    steps:
      - name: Which kit commit is this workflow?
        id: kit
        env:
          PINNED: ${{ inputs.kit-version }}
        run: |
          if [ -n "$PINNED" ]; then
            echo "version=$PINNED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          token=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=go-agent-kit" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in 2) payload="$payload==" ;; 3) payload="$payload=" ;; esac
          sha=$(printf '%s' "$payload" | base64 -d | jq -r .job_workflow_sha)
          case $sha in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) echo "version=$sha" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the job's token names no workflow commit" && exit 1 ;;
          esac

  kit:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the kit and the tools its proofs ran with
        env:
          GOTOOLCHAIN: auto # a tool may need a newer Go than the app; it builds a separate binary
          KIT_VERSION: ${{ needs.version.outputs.kit }}
        run: |
          go install "github.com/McReaper/go-agent-kit/cmd/kit@$KIT_VERSION"
          dir=$(go mod download -json "github.com/McReaper/go-agent-kit@$KIT_VERSION" | jq -r .Dir)
          grep -v '^#' "$dir/tools.txt" | grep @ | xargs -n1 go install
          pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -RequiredVersion $(awk '$1 == "PSScriptAnalyzer" {print $2}' "$dir/tools.txt") -Scope CurrentUser -Force"
          python3 -m pip install --user "zizmor==$(awk '$1 == "zizmor" {print $2}' "$dir/tools.txt")"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          v=$(awk '$1 == "shellcheck" {print $2}' "$dir/tools.txt")
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/shellcheck-v$v/shellcheck" /usr/local/bin/
      - name: Which commits has a code owner approved?
        # Each approved commit's tree goes to kit check, from the API, so a
        # commit a rebase left behind still counts: a protected file whose
        # content is the one approved stays approved.
        id: approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/approved-trees"
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.state == "APPROVED" and (.author_association == "OWNER" or .author_association == "MEMBER")) | .commit_id' |
            sort -u > "$RUNNER_TEMP/approved-commits"
          head=false
          while read -r sha; do
            if [ "$sha" = "$HEAD" ]; then head=true; fi
            gh api "repos/$REPO/git/trees/$sha?recursive=1" \
              --jq '.tree[] | select(.type == "blob") | "\(.sha) \(.path)"' > "$RUNNER_TEMP/approved-trees/$sha"
          done < "$RUNNER_TEMP/approved-commits"
          echo "approved=$head" >> "$GITHUB_OUTPUT"
      - name: kit check
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          APPROVED: ${{ steps.approval.outputs.approved || 'false' }}
        run: kit check --base "origin/$BASE" --ci --approved="$APPROVED" --approved-trees "$RUNNER_TEMP/approved-trees"
      - name: kit mutate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: kit mutate --base "origin/$BASE"

  automerge:
    # A pull request into the default branch merges by itself once the
    # ruleset holds: the kit check green, and the owner's approval where the
    # harness changed. One stacked on another branch waits to be moved. The
    # merge is GitHub Actions', so it starts no workflow on the default branch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn on auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr merge "$PR" --repo "$REPO" --auto --squash; then
            echo "::warning::auto-merge didn't turn on: allow it in the repository's settings (General, Pull Requests)"
          fi

  review:
    # The review sheet: one comment on the pull request, updated on each
    # push, and the kit's label to match.
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the kit and apidiff
        env:
          GOTOOLCHAIN: auto
          KIT_VERSION: ${{ needs.version.outputs.kit }}
        run: |
          go install "github.com/McReaper/go-agent-kit/cmd/kit@$KIT_VERSION"
          dir=$(go mod download -json "github.com/McReaper/go-agent-kit@$KIT_VERSION" | jq -r .Dir)
          grep '^golang.org/x/exp/cmd/apidiff@' "$dir/tools.txt" | xargs go install
      - name: Post the review sheet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          sheet="$RUNNER_TEMP/sheet.md"
          kit review --base "origin/$BASE" > "$sheet"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- kit review -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api "repos/$REPO/issues/comments/$id" --method PATCH -F "body=@$sheet" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$sheet"
          fi
          kit review --base "origin/$BASE" --labels | while read -r label; do
            name=${label#?}
            case $label in
              +*) gh label create "$name" --repo "$REPO" --force > /dev/null
                  gh pr edit "$PR" --repo "$REPO" --add-label "$name" ;;
              -*) gh pr edit "$PR" --repo "$REPO" --remove-label "$name" > /dev/null 2>&1 || true ;;
            esac
          done
