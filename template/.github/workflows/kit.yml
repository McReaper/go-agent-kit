name: kit

# The kit's merge check and review sheet. Both pins name the same kit
# commit; move them together.

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]

permissions: {}

jobs:
  kit:
    permissions:
      contents: read
      pull-requests: write # the review sheet's comment
      issues: write # the review sheet's labels
    uses: McReaper/go-agent-kit/.github/workflows/kit-check.yml@bf821cb8b654ec578e7245ca0c38753710cfca8c
    with:
      kit-version: bf821cb8b654ec578e7245ca0c38753710cfca8c
